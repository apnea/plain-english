# .vale.ini — plain-English scoring config for the plain-english testbed.
# Styles: write-good (passive/weasel/filler), proselint (Orwell/Strunk checks),
# Readability (grade-level metrics). Sync with: vale sync
StylesPath = vale/styles
MinAlertLevel = suggestion

Packages = write-good, proselint, Readability

[*.{md,txt}]
BasedOnStyles = write-good, proselint, Readability
proselint.CurlyQuotes = NO
Readability.Polysyllables = NO
